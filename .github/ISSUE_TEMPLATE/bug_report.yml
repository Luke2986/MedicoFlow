name: Segnala un bug
description: Qualcosa non funziona come dovrebbe
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Grazie per la segnalazione!
        **Non includere dati reali di pazienti** in testo, log o screenshot: usa solo dati inventati.
        Per le vulnerabilità di sicurezza non aprire una issue: segui [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: descrizione
    attributes:
      label: Cosa succede
      description: Descrivi il problema in poche righe.
    validations:
      required: true
  - type: textarea
    id: passi
    attributes:
      label: Passi per riprodurlo
      placeholder: |
        1. Vai su ...
        2. Clicca su ...
        3. Compare ...
    validations:
      required: true
  - type: textarea
    id: atteso
    attributes:
      label: Cosa ti aspettavi
    validations:
      required: true
  - type: dropdown
    id: ambiente
    attributes:
      label: Dove gira l'app
      options:
        - In locale (npm run dev)
        - Vercel
        - Docker
        - Server Node (VPS, Render, Railway...)
        - Altro
    validations:
      required: true
  - type: input
    id: versione
    attributes:
      label: Commit o versione
      description: Ad esempio l'hash del commit (git rev-parse --short HEAD).
  - type: textarea
    id: log
    attributes:
      label: Log o screenshot
      description: Errori dal terminale o dalla console del browser. Togli eventuali dati personali.
      render: shell
